name: daily
on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST
  workflow_dispatch:
    inputs:
      approve:
        description: "公開に回す記事のslug（任意）"
        required: false
      redo:
        description: "取り下げて作り直す記事のslug（任意）"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 承認
        if: ${{ github.event.inputs.approve != '' }}
        run: python run.py approve "${{ github.event.inputs.approve }}"
      - name: 日次実行
        if: ${{ github.event.inputs.approve == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          REDO: ${{ github.event.inputs.redo }}
        run: |
          if [ -n "$REDO" ]; then python run.py redo "$REDO"; fi
          python run.py daily
      - name: 反映
        run: |
          git config user.name "office-bot"
          git config user.email "office-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily run"
          git pull --rebase origin main
          git push
